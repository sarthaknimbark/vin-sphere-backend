name: Model Retraining Pipeline

on:
  repository_dispatch:
    types: [retrain]

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Retraining Pipeline
      env:
        PGHOST: ${{ secrets.PGHOST }}
        PGPORT: ${{ secrets.PGPORT }}
        PGDATABASE: ${{ secrets.PGDATABASE }}
        PGUSER: ${{ secrets.PGUSER }}
        PGPASSWORD: ${{ secrets.PGPASSWORD }}
        PYTHONUNBUFFERED: "1"
      run: |
        CMD="python retrain.py"
        
        if [ "${{ github.event.client_payload.epochs }}" != "" ]; then
          CMD="$CMD --epochs ${{ github.event.client_payload.epochs }}"
        fi
        if [ "${{ github.event.client_payload.downsample }}" != "" ]; then
          CMD="$CMD --downsample ${{ github.event.client_payload.downsample }}"
        fi
        if [ "${{ github.event.client_payload.batch_size }}" != "" ]; then
          CMD="$CMD --batch_size ${{ github.event.client_payload.batch_size }}"
        fi
        if [ "${{ github.event.client_payload.lr }}" != "" ]; then
          CMD="$CMD --lr ${{ github.event.client_payload.lr }}"
        fi
        if [ "${{ github.event.client_payload.fast }}" = "true" ]; then
          CMD="$CMD --fast"
        fi
        
        echo "Executing: $CMD"
        $CMD
        
    - name: Commit and Push Updated Models
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add the active production model directories
        git add "chat_cat(2.0)/models/"
        git add "chat_cat_short_vin/models/"
        git add "chat_cat_short_vin_11/models/"
        git add "chat_cat_short_vin_12/models/"
        git add "models/"
        
        if git status --porcelain | grep -qE "^[AMDRD]"; then
          echo "Model updates detected. Committing and pushing..."
          git commit -m "Auto-update trained model weights [skip ci]"
          git push
        else
          echo "No changes in production models. Skipping commit."
        fi
